<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon cahier annoté</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#f3ece1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1815" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: chaleureux et calme, un carnet posé sur un bureau en bois clair
   IDEA: la papeterie — papier crème, couverture orange, crayon graphite
   PICTURE: les pages elles-mêmes, grandes, posées sur un fond beige ; vignettes comme des carnets
   COLOUR and TYPE: beige #f3ece1, papier #fffaf3, graphite #2b2520, gris chaud #7b6f64, orange #e8590c ; Inter
   LAYOUT: barre d'en-tête collante (titre + actions) puis rangée d'outils défilante ; grille de carnets */
:root{color-scheme:light dark;
  --bg:light-dark(#f3ece1,#1b1815);--desk:light-dark(#e9e0d2,#141210);--card:light-dark(#fffaf3,#25211d);--bar:light-dark(rgba(255,250,243,.92),rgba(37,33,29,.92));
  --ink:light-dark(#2b2520,#f3ece3);--mute:light-dark(#7b6f64,#b3a698);--line:light-dark(#e3d8c8,#3a342d);--soft:light-dark(#f8efe3,#2e2924);
  --acc:#e8590c;--acc2:light-dark(#c2410c,#ff8a4c);--accsoft:light-dark(#fde7d6,#43281a);--z:1;--r:12px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{width:34px;height:34px;flex:none}.logo.xl{width:64px;height:64px;margin-bottom:6px}
button,.btn{font:inherit;font-weight:500;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-width:44px;height:44px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
button:hover:not(:disabled){border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 55%,transparent);outline-offset:2px}
button.primary,.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.primary:hover:not(:disabled){background:var(--acc2);border-color:var(--acc2)}
button.soft{background:var(--accsoft);border-color:transparent;color:var(--acc2);font-weight:600}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--soft)}
button[aria-pressed=true]{background:var(--accsoft);border-color:var(--acc);color:var(--acc2)}
button:disabled{opacity:.38;cursor:default}
select{font:inherit;font-size:16px;height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px;cursor:pointer}
input[type=text]{font:inherit;font-size:16px;height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px}
.grp{display:flex;gap:4px;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 0 0 1px rgba(0,0,0,.12)}
.colors button{padding:0;width:44px;background:transparent;border-color:transparent}
.colors button[aria-pressed=true]{background:var(--card);border-color:var(--acc);box-shadow:0 0 0 2px var(--accsoft)}
.hint{font-size:13px;color:var(--mute)}
/* ----- bibliothèque ----- */
.appbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px max(3vw,14px);padding-top:max(10px,env(safe-area-inset-top));background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:17px}
.libstatus{margin-left:auto;font-size:13px;color:var(--mute);text-align:right;max-width:52ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libwrap{max-width:1240px;margin:0 auto;padding:clamp(18px,3.5vw,40px) max(3vw,14px) calc(60px + env(safe-area-inset-bottom))}
.hero{display:flex;flex-wrap:wrap;gap:18px 32px;align-items:flex-end;justify-content:space-between;background:linear-gradient(135deg,var(--card),var(--soft));border:1px solid var(--line);border-radius:22px;padding:clamp(20px,3.5vw,34px);margin-bottom:18px}
.hero h2{font-size:clamp(30px,4.5vw,44px);line-height:1.05;margin:0 0 8px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--mute);max-width:48ch;font-size:16px}
.heroacts{display:flex;flex-direction:column;gap:10px;min-width:min(100%,300px)}
.heroacts .big{height:52px;font-size:16px;border-radius:14px}
.newrow{display:flex;gap:8px}.newrow select{flex:1}
.drop{border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--mute);margin-bottom:26px;font-size:14px}
.drop.on{border-color:var(--acc);color:var(--ink);background:var(--accsoft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,200px),1fr));gap:clamp(12px,2vw,22px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(60,40,20,.12)}
.thumb{display:block;width:100%;aspect-ratio:3/4;background:var(--desk);border:0;border-bottom:1px solid var(--line);padding:12px 14px 0;border-radius:0;height:auto;cursor:pointer;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;background:#fff;border-radius:4px 4px 0 0;box-shadow:0 2px 10px rgba(60,40,20,.18)}
.meta{padding:10px 12px 2px}
.meta b{display:block;font-size:15px;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta span{font-size:12.5px;color:var(--mute)}
.acts{display:flex;gap:6px;padding:8px 10px 12px;flex-wrap:wrap}
.acts button{height:34px;min-width:34px;font-size:13px;padding:0 10px;border-radius:9px}
.acts button:first-child{background:var(--accsoft);border-color:transparent;color:var(--acc2);font-weight:600}
.acts .armed{background:#c0262d!important;border-color:#c0262d!important;color:#fff!important}
.empty{color:var(--mute);padding:30px 0;grid-column:1/-1}
/* ----- lecteur ----- */
header.reader{position:sticky;top:0;z-index:10;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar{display:flex;align-items:center;gap:10px;padding:8px max(2vw,10px) 4px}
.topbar h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#status{font-size:12.5px;color:var(--mute);white-space:nowrap}
.tools{display:flex;align-items:center;gap:6px;padding:4px max(2vw,10px) 8px;overflow-x:auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.tools>*{flex:none}
.tools .sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.seg{background:var(--soft);border-radius:14px;padding:3px;gap:2px}
.seg button{border-color:transparent;background:transparent;height:40px}
.seg button[aria-pressed=true]{background:var(--card);border-color:var(--line);color:var(--acc2);box-shadow:0 1px 3px rgba(60,40,20,.12)}
main#pages{padding:clamp(12px,2.5vw,28px) 8px calc(90px + env(safe-area-inset-bottom));overflow-x:auto;background:var(--desk);min-height:100vh}
.page{position:relative;width:calc(min(100%,920px)*var(--z));margin:0 auto 34px;background:#fff;box-shadow:0 1px 2px rgba(60,40,20,.12),0 10px 30px rgba(60,40,20,.12);border-radius:3px}
.page>img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;pointer-events:none;border-radius:3px}
.page canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-x pan-y pinch-zoom}
body.finger .page canvas{touch-action:none}
body.erase .page canvas{cursor:cell}
body:not(.erase) .page canvas{cursor:crosshair}
.num{position:absolute;right:2px;bottom:-24px;font-size:12px;color:var(--mute)}
.layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
body.sel .layer{pointer-events:auto}
body.sel .page canvas{pointer-events:none}
.im{position:absolute;outline:1px dashed transparent}
.im img{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none}
body.sel .im{cursor:move;touch-action:none;outline-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.im .rs,.im .x{display:none}
body.sel .im.on{outline:2px solid var(--acc)}
body.sel .im.on .rs{display:block;position:absolute;right:4px;bottom:4px;width:30px;height:30px;border-radius:50%;background:var(--acc);border:3px solid #fff;cursor:nwse-resize;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.25)}
body.sel .im.on .x{display:inline-flex;position:absolute;top:4px;right:4px;width:36px;height:36px;min-width:36px;padding:0;border-radius:50%;background:#c0262d;border:2px solid #fff;color:#fff;font-size:18px}
.im.up{opacity:.6}
.page.dropping{outline:3px dashed var(--acc);outline-offset:4px}
.del{position:absolute;top:10px;right:10px;z-index:2;font-size:12.5px;height:34px;min-width:34px;padding:0 10px;opacity:0;transition:opacity .15s;background:var(--card)}
.page:hover .del,.del:focus-visible,.del.armed{opacity:1}
@media(hover:none){.del{opacity:.85}}
.del.armed{background:#c0262d;border-color:#c0262d;color:#fff}
/* ----- divers ----- */
#login{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 30% 20%,var(--card),var(--bg) 70%);display:flex;align-items:center;justify-content:center;padding:20px}
.logbox{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(24px,5vw,40px);max-width:420px;text-align:center;box-shadow:0 20px 50px rgba(60,40,20,.12)}
.logbox h2{font-size:30px;margin:0 0 8px;letter-spacing:-.01em}.logbox p{color:var(--mute)}
.logbox .primary{height:52px;padding:0 22px;font-size:16px;border-radius:14px;margin-top:6px}
#busy{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--bg) 94%,transparent);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:16px;padding:20px;text-align:center}
.bar{width:min(320px,80vw);height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
#render{position:absolute;left:0;top:0;z-index:-1;background:#fff;color:#000}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ----- écrans ----- */
@media(max-width:1560px){.tools .grp:not(.seg) .tlabel{display:none}}
@media(max-width:1440px){.tools .tlabel{display:none}.tools button{padding:0 10px}}
.tools.ovf{-webkit-mask-image:linear-gradient(to right,#000 85%,transparent);mask-image:linear-gradient(to right,#000 85%,transparent)}
@media(max-width:1100px){.tools .tlabel{display:none}.tools button{padding:0 10px}}
@media(max-width:700px){.topbar .tlabel{display:none}#status{display:none}.libstatus{display:none}.brand b{font-size:16px}
  .hero{border-radius:18px}.heroacts{width:100%}.appbar .tlabel{display:none}}
@media(max-width:600px){.del{font-size:11.5px;height:30px;padding:0 8px;top:6px;right:6px}.num{bottom:-22px}}
@media(max-width:420px){.colors button{width:38px;min-width:38px}.tools .sep{display:none}}
@media print{header,.appbar,.del,.num{display:none!important}main#pages{background:#fff;padding:0}.page{box-shadow:none;margin:0 auto;page-break-after:always}}
</style>
</head>
<body>
<div id="login" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
  <div class="logbox">
    <svg class="logo xl" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#e8590c"/><rect x="10" y="8" width="19" height="24" rx="3" fill="#fffaf2"/><path d="M14 8v24" stroke="#f0a070" stroke-width="1.6"/><path d="M17 15h8M17 19h8M17 23h5" stroke="#e7d9c6" stroke-width="1.6"/><path d="M24 29l9-12 2.5 1.8-9 12L23 32z" fill="#2b2520"/></svg>
    <h2 id="loginTitle">Mon cahier annoté</h2>
    <p>Connectez-vous pour retrouver vos cahiers et vos notes sur tous vos appareils.</p>
    <button class="primary" id="loginBtn">Se connecter avec Google</button>
    <p id="loginMsg" class="hint" style="margin:12px 0 0"></p>
  </div>
</div>
<!-- Bibliothèque -->
<div id="libView">
  <header class="appbar">
    <div class="brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#e8590c"/><rect x="10" y="8" width="19" height="24" rx="3" fill="#fffaf2"/><path d="M14 8v24" stroke="#f0a070" stroke-width="1.6"/><path d="M17 15h8M17 19h8M17 23h5" stroke="#e7d9c6" stroke-width="1.6"/><path d="M24 29l9-12 2.5 1.8-9 12L23 32z" fill="#2b2520"/></svg><b>Mon cahier annoté</b></div>
    <span id="libStatus" class="libstatus"></span>
    <button id="logoutBtn" class="ghost" title="Se déconnecter"><svg class="i" viewBox="0 0 24 24"><path d="M15 4h4a1 1 0 011 1v14a1 1 0 01-1 1h-4M10 17l5-5-5-5M15 12H3"/></svg><span class="tlabel">Déconnexion</span></button>
  </header>
  <div class="libwrap">
    <section class="hero">
      <div class="herotext">
        <h2>Mes cahiers</h2>
        <p>Importez un PDF ou un Word, ou ouvrez un cahier vierge, puis écrivez dessus au stylet.</p>
      </div>
      <div class="heroacts">
        <button class="primary big" id="importBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>Importer PDF / Word</button>
        <div class="newrow">
          <select id="newType" aria-label="Type de cahier vierge">
            <option value="seyes">Grands carreaux</option>
            <option value="grid">Petits carreaux</option>
            <option value="blank">Feuilles blanches</option>
          </select>
          <button id="newBtn" class="soft"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nouveau cahier</button>
        </div>
        <input type="file" id="docFile" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple hidden>
      </div>
    </section>
    <div class="drop" id="dropZone">Ou glissez un fichier PDF ou .docx ici</div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- Lecteur -->
<div id="docView" hidden>
<header class="reader">
  <div class="topbar">
    <button id="back" class="ghost" title="Retour à la bibliothèque" aria-label="Retour à la bibliothèque"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span class="tlabel">Bibliothèque</span></button>
    <h1 id="docTitle"></h1>
    <span id="status"></span>
    <button id="dl" class="primary" hidden title="Télécharger le PDF annoté"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M4 19h16"/></svg><span class="tlabel">Télécharger le PDF</span></button>
  </div>
  <div class="tools" role="toolbar" aria-label="Outils">
    <div class="grp seg" role="group" aria-label="Outil">
      <button id="tPen" aria-pressed="true" title="Stylo"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg><span class="tlabel">Stylo</span></button>
      <button id="tHi" aria-pressed="false" title="Surligneur"><svg class="i" viewBox="0 0 24 24"><path d="M9 15l-3 5h6l1-2"/><path d="M9 15l8-11 4 3-8 11z"/></svg><span class="tlabel">Surligneur</span></button>
      <button id="tSel" aria-pressed="false" title="Déplacer / redimensionner les images"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span class="tlabel">Déplacer</span></button>
      <button id="tEr" aria-pressed="false" title="Gomme (efface un trait entier)"><svg class="i" viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4 15l9-9 6 6-7 7H8z"/></svg><span class="tlabel">Gomme</span></button>
    </div>
    <span class="sep"></span>
    <div class="grp colors" role="group" aria-label="Couleur" id="colors"></div>
    <select id="size" aria-label="Épaisseur"><option value="0.0016">Fin</option><option value="0.0026" selected>Moyen</option><option value="0.0045">Épais</option></select>
    <span class="sep"></span>
    <div class="grp">
      <button id="undo" aria-label="Annuler" title="Annuler" disabled><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
      <button id="redo" aria-label="Rétablir" title="Rétablir" disabled><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg></button>
      <button id="zOut" aria-label="Dézoomer" title="Dézoomer"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M21 21l-5-5"/></svg></button>
      <button id="zIn" aria-label="Zoomer" title="Zoomer"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M21 21l-5-5"/></svg></button>
      <button id="finger" aria-pressed="false" title="Écrire aussi avec le doigt"><svg class="i" viewBox="0 0 24 24"><path d="M8 13V5a1.5 1.5 0 013 0v6M11 11V4a1.5 1.5 0 013 0v7M14 11V5.5a1.5 1.5 0 013 0V13c0 4-2.5 7-6 7-2.5 0-4-1.2-5.2-3.2L4 13.6a1.5 1.5 0 012.5-1.6L8 14"/></svg><span class="tlabel">Doigt</span></button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <select id="sheetType" aria-label="Type de feuille"><option value="seyes">Grands carreaux</option><option value="grid">Petits carreaux</option><option value="blank">Blanche</option></select>
      <button id="addSheet" title="Ajouter une feuille à la fin"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 00-1 1v16a1 1 0 001 1h12a1 1 0 001-1V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg><span class="tlabel">Feuille</span></button>
      <button id="addImg" title="Insérer une image sur la page visible"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg><span class="tlabel">Image</span></button>
      <input type="file" id="imgFile" accept="image/*" multiple hidden>
      <button id="clearPage" title="Effacer les traits de la page visible"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span class="tlabel">Effacer la page</span></button>
    </div>
  </div>
</header>
<main id="pages"></main>
</div>

<div id="busy" hidden role="status" aria-live="polite"><div id="busyText">Importation…</div><div class="bar"><i id="busyBar"></i></div></div>
<div id="render" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const status=$("#status"), toast=$("#toast"), pagesEl=$("#pages");
const COLORS=[["#1a3fd6","Bleu"],["#d11f1f","Rouge"],["#111111","Noir"],["#108a3a","Vert"],["#f2c400","Jaune (surligneur)"]];

  const hl=(y,col,w)=>{x.strokeStyle=col;x.lineWidth=w;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()};
  const vl=(X,col,w)=>{x.strokeStyle=col;x.lineWidth=w;x.beginPath();x.moveTo(X,0);x.lineTo(X,H);x.stroke()};
  if(type==="seyes"){const top=20*mm;for(let k=0;top+k*2*mm<H-8*mm;k++){const y=top+k*2*mm;hl(y,k%4===0?"#8aa6d8":"#c9d4ee",k%4===0?1.4:0.8)}
    for(let X=40*mm;X<W-4*mm;X+=8*mm)vl(X,"#c9d4ee",0.8);vl(32*mm,"#e0565b",1.6)}
  else if(type==="grid"){for(let y=10*mm;y<H-5*mm;y+=5*mm)hl(y,"#c4cbd8",0.8);for(let X=10*mm;X<W-5*mm;X+=5*mm)vl(X,"#c4cbd8",0.8)}

}

async function storeBg(blob){
  if(assets){try{const r=await assets.upload(blob,{type:blob.type||"image/jpeg"});return{a:r.id}}
    catch(e){if(e&&e.code==="quota_or_state")throw new Error("quota");}}
  return{tmp:URL.createObjectURL(blob)};
}
async function importFiles(files){
  for(const f of files){
    const n=(f.name||"").toLowerCase(),isPdf=n.endsWith(".pdf")||f.type==="application/pdf",isDocx=n.endsWith(".docx");
    if(!isPdf&&!isDocx){say("Format non pris en charge : "+(f.name||"fichier")+" (PDF ou .docx uniquement)");continue}
    const name=(f.name||"Document").replace(/\.(pdf|docx)$/i,"");
    let d;
    try{d=isPdf?await importPdf(f,name):await importDocx(f,name)}
    catch(e){busy();say(e&&e.message==="quota"?"Espace de stockage plein : supprimez d'anciens documents":"Impossible d'importer « "+name+" »"+(e&&e.message==="lib"?" (bibliothèque non chargée, vérifiez la connexion)":""));continue}
    busy();lib.unshift(d);saveLib();renderLib();
    if(d.pages.some(p=>p.tmp))say("Importé, mais l'enregistrement durable est indisponible ici : le document sera perdu à la fermeture");
    if(files.length===1)openDoc(d);else say("« "+name+" » importé");
  }
}
async function importPdf(f,name){
  busy("Lecture du PDF…",0);
  try{await loadScript(LIBS.pdfw);await loadScript(LIBS.pdf)}catch(e){throw new Error("lib")}
  const lib_=window.pdfjsLib;lib_.GlobalWorkerOptions.workerSrc=LIBS.pdfw;
  const pdf=await lib_.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise;
  const d={id:uid(),name,kind:"pdf",created:Date.now(),pages:[]};
  for(let i=1;i<=pdf.numPages;i++){
    busy("Importation de « "+name+" » : page "+i+" / "+pdf.numPages,(i-1)/pdf.numPages);
    const pg=await pdf.getPage(i),v1=pg.getViewport({scale:1});
    let s=1400/v1.width;if(v1.height*s>4000)s=4000/v1.height;
    const vp=pg.getViewport({scale:s}),c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:x,viewport:vp}).promise;
    const st=await storeBg(await canvasBlob(c,"image/jpeg",.85));
    d.pages.push({id:"p"+i,...st,w:c.width,h:c.height});
  }
  return d;
}
async function importDocx(f,name){

    busy("Mise en page de « "+name+" » : partie "+(k+1)+" / "+targets.length,k/targets.length);

      d.pages.push({id:"p"+(d.pages.length+1),...st,w:c.width,h:PH});
    }
  }
  box.replaceChildren();
  if(!d.pages.length)throw new Error("vide");

}

function removeImg(P,o){const k=P.imgs.indexOf(o);if(k<0)return;P.imgs.splice(k,1);if(selected===o)select(null);renderImgs(P);pushOp({t:"im-",P,o,k});changed(P);say("Image supprimée (Annuler pour revenir)")}
async function prep(file){
  const u=URL.createObjectURL(file);let i;try{i=await loadImg(u)}catch(e){URL.revokeObjectURL(u);throw e}
  const W=i.naturalWidth,H=i.naturalHeight,M=2400;
  if(Math.max(W,H)<=M&&file.size<4e6&&/^image\/(png|jpeg|webp|gif)$/.test(file.type))return{blob:file,w:W,h:H,url:u};
  const s=Math.min(1,M/Math.max(W,H)),c=document.createElement("canvas");c.width=Math.round(W*s);c.height=Math.round(H*s);
  const x=c.getContext("2d"),png=file.type==="image/png";if(!png){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(i,0,0,c.width,c.height);
  const blob=await canvasBlob(c,png?"image/png":"image/jpeg",.88);URL.revokeObjectURL(u);return{blob,w:c.width,h:c.height,url:URL.createObjectURL(blob)};
}
async function smallData(url){const i=await loadImg(url);const s=Math.min(1,1100/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement("canvas");
  c.width=Math.round(i.naturalWidth*s);c.height=Math.round(i.naturalHeight*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.8)}
function viewCenter(P){const r=P.el.getBoundingClientRect(),hb=document.querySelector("#docView header").getBoundingClientRect().bottom;
  const top=Math.max(r.top,hb),bot=Math.min(r.bottom,innerHeight);return{x:.5,y:bot>top?((top+bot)/2-r.top)/r.height:.3}}
async function insertImages(files,P,at){
  at=at||viewCenter(P);let n=0;
  for(const f of files){
    let p;try{p=await prep(f)}catch(e){say("Image illisible : "+(f.name||"fichier"));continue}
    const o={id:"i"+uid(),r:r4(p.h/p.w),w:.6,tmp:p.url};
    if(o.w*o.r*P.ar>.7)o.w=.7/(o.r*P.ar);o.w=r4(o.w);
    const hN=o.w*o.r*P.ar;o.x=r4(clamp(at.x-o.w/2+n*.03,0,Math.max(0,1-o.w)));o.y=r4(clamp(at.y-hN/2+n*.03,0,Math.max(0,1-hN)));n++;
    P.imgs.push(o);renderImgs(P);pushOp({t:"im+",P,o});setTool("sel");select(o);o.el.classList.add("up");status.textContent="Envoi de l'image…";
    let ok=false;
    if(assets){try{const r=await assets.upload(p.blob,{type:p.blob.type||"image/jpeg"});o.a=r.id;ok=true}catch(e){}}
    if(!ok){try{o.d=await smallData(p.url)}catch(e){}}
    o.el&&o.el.classList.remove("up");changed(P);
  }
  if(n)say(n>1?n+" images insérées : déplacez-les, le rond bleu redimensionne":"Image insérée : déplacez-la, le rond bleu redimensionne");
}
$("#addImg").onclick=()=>$("#imgFile").click();
$("#imgFile").onchange=e=>{const fs=[...e.target.files];e.target.value="";if(fs.length&&doc)insertImages(fs,visiblePage())};
document.addEventListener("paste",e=>{if(!doc)return;const fs=[...(e.clipboardData&&e.clipboardData.files||[])].filter(f=>f.type.startsWith("image/"));if(fs.length){e.preventDefault();insertImages(fs,visiblePage())}});

/* ---------- dessin ---------- */
function strokeW(s,W,pr){return s.h?s.w*W*4:s.w*W*(0.45+(pr??0.5)*1.1)}
function drawStroke(ctx,s,W,H){
  const p=s.p;if(!p||!p.length)return;ctx.save();ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=s.c;
  if(s.h){ctx.globalAlpha=.35;ctx.globalCompositeOperation="multiply";ctx.lineWidth=strokeW(s,W);ctx.beginPath();ctx.moveTo(p[0][0]*W,p[0][1]*H);for(const q of p)ctx.lineTo(q[0]*W,q[1]*H);if(p.length===1)ctx.lineTo(p[0][0]*W+.1,p[0][1]*H);ctx.stroke()}
  else{if(p.length===1){ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(p[0][0]*W,p[0][1]*H,strokeW(s,W,p[0][2])/2,0,7);ctx.fill()}
    for(let k=1;k<p.length;k++){ctx.lineWidth=strokeW(s,W,(p[k][2]+p[k-1][2])/2);ctx.beginPath();ctx.moveTo(p[k-1][0]*W,p[k-1][1]*H);ctx.lineTo(p[k][0]*W,p[k][1]*H);ctx.stroke()}}
  ctx.restore();
}
function redraw(P){const{ctx,cv}=P;ctx.clearRect(0,0,cv.width,cv.height);for(const s of P.strokes)drawStroke(ctx,s,cv.width,cv.height)}
function bindCanvas(P){
  const cv=P.cv;let cur=null,pid=null;
  const stylusTouch=e=>[...e.touches].some(t=>t.touchType==="stylus");
  cv.addEventListener("touchstart",e=>{if(fingerMode||stylusTouch(e))e.preventDefault()},{passive:false});
  cv.addEventListener("touchmove",e=>{if(cur||fingerMode||stylusTouch(e))e.preventDefault()},{passive:false});
  const pos=e=>{const r=cv.getBoundingClientRect();return[r4((e.clientX-r.left)/r.width),r4((e.clientY-r.top)/r.height),e.pointerType==="pen"&&e.pressure>0?Math.round(e.pressure*100)/100:.5]};
  cv.addEventListener("pointerdown",e=>{
    if(e.pointerType==="pen")penSeen=Date.now();
    if(e.pointerType==="touch"&&(!fingerMode||Date.now()-penSeen<1500))return;
    if(e.button>0)return;e.preventDefault();cv.setPointerCapture(e.pointerId);pid=e.pointerId;
    if(tool==="er"){cur={erase:true};eraseAt(P,pos(e));return}
    cur={c:tool==="hi"?hiColor:color,w:+$("#size").value,h:tool==="hi",p:[pos(e)]};
    if(!cur.h)drawStroke(P.ctx,{...cur},cv.width,cv.height)});
  cv.addEventListener("pointermove",e=>{
    if(!cur||e.pointerId!==pid)return;e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of (evs.length?evs:[e])){const q=pos(ev);
      if(cur.erase){eraseAt(P,q);continue}
      const last=cur.p[cur.p.length-1];if(Math.abs(q[0]-last[0])+Math.abs(q[1]-last[1])<0.0008)continue;
      cur.p.push(q);
      if(cur.h){redraw(P);drawStroke(P.ctx,cur,cv.width,cv.height)}
      else drawStroke(P.ctx,{c:cur.c,w:cur.w,h:false,p:[last,q]},cv.width,cv.height)}});
  const end=e=>{if(!cur||e.pointerId!==pid)return;if(!cur.erase){P.strokes.push(cur);pushOp({t:"add",P,s:cur});redraw(P);changed(P)}cur=null;pid=null};
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
}
function eraseAt(P,q){
  const r=0.012;let hit=false;
  for(let k=P.strokes.length-1;k>=0;k--){const s=P.strokes[k];
    if(s.p.some(p=>Math.hypot(p[0]-q[0],(p[1]-q[1])/P.ar)<r)){P.strokes.splice(k,1);pushOp({t:"del",P,s,k});hit=true}}
  if(hit){redraw(P);changed(P)}
}

/* ---------- annuler / rétablir ---------- */
function pushOp(o){undoStack.push(o);redoStack.length=0;syncUR()}
function syncUR(){$("#undo").disabled=!undoStack.length;$("#redo").disabled=!redoStack.length}
function apply(o,rev){const P=o.P;if(!pages.includes(P))return;
  if(o.t==="add"){if(rev){const k=P.strokes.lastIndexOf(o.s);if(k>=0)P.strokes.splice(k,1)}else P.strokes.push(o.s)}
  else if(o.t==="del"){if(rev)P.strokes.splice(Math.min(o.k,P.strokes.length),0,o.s);else{const k=P.strokes.indexOf(o.s);if(k>=0)P.strokes.splice(k,1)}}
  else if(o.t==="clr"){P.strokes=rev?o.prev.slice():[]}
  else if(o.t==="im+"||o.t==="im-"){const add=(o.t==="im+")!==rev;
    if(add){if(!P.imgs.includes(o.o))P.imgs.splice(o.t==="im-"?Math.min(o.k,P.imgs.length):P.imgs.length,0,o.o)}else{const k=P.imgs.indexOf(o.o);if(k>=0)P.imgs.splice(k,1);if(selected===o.o)select(null)}}
  else if(o.t==="imx")Object.assign(o.o,rev?o.from:o.to);
  redraw(P);renderImgs(P);changed(P);P.el.scrollIntoView({block:"nearest",behavior:"smooth"})}
$("#undo").onclick=()=>{const o=undoStack.pop();if(o){apply(o,true);redoStack.push(o);syncUR()}};
$("#redo").onclick=()=>{const o=redoStack.pop();if(o){apply(o,false);undoStack.push(o);syncUR()}};
document.addEventListener("keydown",e=>{if(!doc)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();(e.shiftKey?$("#redo"):$("#undo")).click();return}
  if(tool==="sel"&&selected&&(e.key==="Delete"||e.key==="Backspace")&&!/INPUT|SELECT/.test(document.activeElement.tagName)){e.preventDefault();const P=pages.find(p=>p.imgs.includes(selected));if(P)removeImg(P,selected)}
  if(e.key==="Escape")select(null)});
function visiblePage(){let best=pages[0],bv=-1;for(const P of pages){const r=P.el.getBoundingClientRect();const v=Math.min(r.bottom,innerHeight)-Math.max(r.top,0);if(v>bv){bv=v;best=P}}return best}
let armed=null;
$("#clearPage").onclick=()=>{const P=visiblePage(),n=pages.indexOf(P)+1;if(!P.strokes.length){say("Aucun trait à effacer sur la page "+n);return}
  if(armed!==P){armed=P;say("Touchez encore pour effacer les traits de la page "+n);setTimeout(()=>{if(armed===P)armed=null},3000);return}
  armed=null;const prev=P.strokes.slice();P.strokes=[];pushOp({t:"clr",P,prev});redraw(P);changed(P);say("Traits de la page "+n+" effacés (Annuler pour revenir)")};

/* ---------- sauvegarde des annotations ---------- */
const data=r=>r&&typeof r.data==="function"?r.data():r;
const pgKey=(d,pg)=>LS+d.id+"-"+pg.id;
const imgsOut=P=>P.imgs.filter(o=>o.a||o.d).map(({id,a,d,x,y,w,r})=>({id,a,d,x,y,w,r}));
function readPayload(P,s,m){try{if(typeof s==="string")s=JSON.parse(s);if(typeof m==="string")m=JSON.parse(m)}catch(e){return}
  if(Array.isArray(s))P.strokes=s.filter(x=>x&&Array.isArray(x.p)&&typeof x.c==="string");
  if(Array.isArray(m))P.imgs=m.filter(o=>o&&(typeof o.a==="string"||typeof o.d==="string")&&isFinite(o.x)&&isFinite(o.y)&&isFinite(o.w)&&o.r>0);
  redraw(P);renderImgs(P)}
function cacheLocal(P){const k=pgKey(doc,P.pg);try{localStorage.setItem(k,JSON.stringify({s:P.strokes,m:imgsOut(P)}))}catch(e){try{localStorage.setItem(k,JSON.stringify({s:P.strokes,m:imgsOut(P).filter(o=>o.a)}))}catch(e2){}}}
const timers={},writing={},again={};
function changed(P){cacheLocal(P);if(!col){status.textContent="Enregistré sur cet appareil";return}
  status.textContent="Enregistrement…";const key=doc.id+"-"+P.id,d=doc;clearTimeout(timers[key]);timers[key]=setTimeout(()=>save(d,P),1200)}
async function save(d,P){const key=d.id+"-"+P.id;if(!d.pages.includes(P.pg))return;if(writing[key]){again[key]=true;return}writing[key]=true;
  try{await col.doc("pg-"+key).set({s:JSON.stringify(P.strokes),m:JSON.stringify(imgsOut(P)),t:Date.now()});if(doc===d)status.textContent="Enregistré"}
  catch(e){if(doc===d)status.textContent="Enregistré sur cet appareil seulement"}
  writing[key]=false;if(again[key]){again[key]=false;save(d,P)}}

/* ---------- export PDF ---------- */
async function exportPdf(){
  const b=$("#dl");if(!window.jspdf){say("Export PDF indisponible (bibliothèque non chargée)");return}
  b.disabled=true;b.textContent="Préparation…";
  try{
    const{jsPDF}=window.jspdf;let pdf=null;
    for(const P of pages){
      if(P.pg.a&&!P.pg.tmp){try{const u=await blobURL(P.pg.a);if(P.img.src!==u){P.img.src=u}}catch(e){}}
      if(!P.img.complete||!P.img.naturalWidth)await new Promise(r=>{P.img.onload=r;P.img.onerror=r;setTimeout(r,8000)});
      const W=P.img.naturalWidth||P.pg.w,H=P.img.naturalHeight||P.pg.h,c=document.createElement("canvas");c.width=W;c.height=H;
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.drawImage(P.img,0,0,W,H);
      for(const o of P.imgs){try{const i=await loadImg(await imSrcAsync(o));x.drawImage(i,o.x*W,o.y*H,o.w*W,o.w*W*o.r)}catch(e){}}
      for(const s of P.strokes)drawStroke(x,s,W,H);
      const pw=595.28,ph=pw*H/W,or=pw>ph?"l":"p";
      if(!pdf)pdf=new jsPDF({unit:"pt",format:[pw,ph],orientation:or});else pdf.addPage([pw,ph],or);
      pdf.addImage(c.toDataURL("image/jpeg",.86),"JPEG",0,0,pw,ph);
    }
    const fn=(doc.name.replace(/[\\/:*?"<>|]+/g," ").trim()||"document")+"_annote.pdf";
    {const u=URL.createObjectURL(pdf.output("blob")),a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}say("PDF téléchargé");
  }catch(e){if(e&&e.code==="declined")say("Téléchargement annulé");else if(e&&e.code==="host_unavailable")say("Ouvrez la page dans un navigateur pour télécharger");else say("Le téléchargement n'a pas abouti")}
  b.disabled=false;b.textContent="Télécharger le PDF annoté";
}
$("#dl").onclick=exportPdf;

/* ---------- démarrage (Firebase) ---------- */
let LS="cahier-";
$("#dl").hidden=false;
$("#loginBtn").onclick=async()=>{$("#loginMsg").textContent="";try{await window.fbLogin()}catch(e){$("#loginMsg").textContent="Connexion impossible : "+(e&&e.code||"erreur")+". Vérifiez que les fenêtres pop-up sont autorisées."}};
$("#logoutBtn").onclick=async()=>{try{await window.fbLogout()}catch(e){}};
window.appNoConfig=()=>{$("#loginMsg").textContent="Configuration Firebase manquante : remplissez le fichier config.js.";$("#loginBtn").disabled=true};
window.onFirebaseLogout=()=>{FB=null;col=null;assets=null;lib=[];doc=null;$("#docView").hidden=true;$("#libView").hidden=false;$("#login").hidden=false};
window.onFirebaseUser=async(api)=>{
  FB=api;LS="cahier-"+api.uid+"-";$("#login").hidden=true;
  col=api.kv;
  assets={upload:async blob=>{const id=uid();const d=await toDataURLLimited(blob);await FB.blobs.put(id,d);blobCache[id]=URL.createObjectURL(blob);return{id}},delete:async id=>{await FB.blobs.del(id)}};
  {const l=parseLib(localStorage.getItem(LS+"lib")||"null");lib=l||[];}
  renderLib();$("#libStatus").textContent="Connexion à votre espace…";
  try{
    const r=data(await col.doc("lib").get());
    if(r&&typeof r.s==="string"){const remote=parseLib(r.s)||[];const local=lib.filter(d=>!remote.some(x=>x.id===d.id));lib=[...local,...remote];if(local.length)saveLib()}
    else{lib=lib.length?lib:[SEED];saveLib()}
    renderLib();
    $("#libStatus").textContent="Connecté"+(api.name?" : "+api.name:"")+" · vos cahiers sont enregistrés sur votre compte";
  }catch(e){$("#libStatus").textContent="Impossible de joindre votre espace pour l'instant : vérifiez la connexion."}
};
}
